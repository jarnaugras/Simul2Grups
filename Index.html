<!DOCTYPE html>
  <html lang="es">
    <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulación de Error Tipo I</title>
        <link rel="stylesheet" href="styles.css">
          </head>
          <body>
          <div class="container">
            <header>
            <h1>Simulación de Error Tipo I</h1>
            <p>Herramienta para analizar el Error Tipo I en diseños de dos grupos</p>
            </header>
            
            <main>
            <section class="input-section">
              <h2>Parámetros de Simulación</h2>
              <form id="simulationForm">
                <div class="form-group">
                  <label for="designType">Tipo de Diseño:</label>
                    <select id="designType">
                      <option value="paired">Apareado</option>
                        <option value="independent">Independiente</option>
                          </select>
                          </div>
                          
                          <div class="form-group">
                            <label for="n1">Tamaño Muestra Grupo 1:</label>
                              <input type="number" id="n1" value="30" min="2">
                                </div>
                                
                                <div class="form-group">
                                  <label for="n2">Tamaño Muestra Grupo 2:</label>
                                    <input type="number" id="n2" value="30" min="2">
                                      </div>
                                      
                                      <div class="form-group">
                                        <label for="alpha">Nivel de Significancia:</label>
                                          <input type="number" id="alpha" value="0.05" step="0.01" min="0" max="1">
                                            </div>
                                            
                                            <button type="button" id="runSimulation">Ejecutar Simulación</button>
                                              </form>
                                              </section>
                                              
                                              <section class="results-section">
                                                <h2>Resultados</h2>
                                                <div id="results">
                                                  <p>Ejecuta la simulación para ver los resultados</p>
                                                  </div>
                                                  </section>
                                                  </main>
                                                  
                                                  <footer>
                                                  <p>Desarrollado con ❤️ para análisis estadístico</p>
                                                  </footer>
                                                  </div>
                                                  <script src="script.js"></script>
                                                    </body>
                                                    </html>
